
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../resources/css/style-guide.css">
    <link rel="stylesheet" href="../resources/css/components/accordion.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../resources/js/components/accordion.js"></script>
</head>
  <body>        
    <div class="container">
    <h2 id="accordion-panel-heading" class="h2">Accordion heading</h2>
    <div class="accordion" id="accordion-panel">
        <h3 class="accordion-title-outer">
            <button aria-expanded="false" class="accordion-trigger" aria-controls="accordion-panel-1-section" id="accordion-panel-1-label" role="button">
                <span class="accordion-title">Test header 1<span class="accordion-icon"></span></span>
            </button>
        </h3>
        <div class="accordion-panel" role="region" id="accordion-panel-1-section" aria-labelledby="accordion-panel-1-label" style="display: none;" hidden="">
            <div>
                <p>Test panel 1 content</p>
            </div>
        </div>
        <h3 class="accordion-title-outer">
            <button aria-expanded="false" class="accordion-trigger" aria-controls="accordion-panel-2-section" id="accordion-panel-2-label" role="button"><span class="accordion-title">Test header 2<span class="accordion-icon"></span></span>
            </button>
        </h3>
        <div class="accordion-panel" role="region" id="accordion-panel-2-section" aria-labelledby="accordion-panel-2-label" hidden="">
            <div>
                <p>Test panel 2 content</p>
            </div>
        </div>
        <h3 class="accordion-title-outer">
                <button aria-expanded="false" class="accordion-trigger" aria-controls="accordion-panel-3-section" id="accordion-panel-3-label" role="button" accordion-title="Accordion heading"><span class="accordion-title">Test header 3<span class="accordion-icon"></span></span>
                </button>
        </h3>
        <div class="accordion-panel" role="region" id="accordion-panel-3-section" aria-labelledby="accordion-panel-3-label" hidden="">
            <div>
                <p>Test panel 3 content</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
