<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<div class="container container-centre">
      <h1 class="h1">Form Elements</h1>
      <form class="container_form" action="#"   oninput="x.value=parseInt(a.value)+parseInt(b.value)">
        
        <!--text field-->
        <label class="container_form_label" for="fname">Example text field<span class="required">*</span></label>
        <input class="container_form_input" type="text" id="fname" required>
        
        <!--textarea-->
        <label class="container_form_label" for="summary">Example textarea<span class="required">*</span></label>
        <textarea class="container_form_input container_form_textarea" id="summary" row="10" col="30">Please add a summary</textarea>
        
        <!--fieldset-->
        <fieldset class="container_form_fieldset">
          <legend class="h3">Fieldset Example</legend>
          <label  class="container_form_label" for="email">Email Address<span class="required">*</span></label>
          <input class="container_form_input" type="text" id="email" name="email" required>
          <label class="container_form_label" for="tel">Telephone:<span class="required">*</span></label>
          <input class="container_form_input" type="text" id="tel" name="tel" required>
        </fieldset>
        
        <!--checkboxes-->
        <h2 class="h3">Checkboxes</h2>
        <input class="container_form_input container_form_checkbox" type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
        <label class="container_form_label container_form_label-ib" for="vehicle1"> I have a bike</label><br>
        <input class="container_form_input container_form_checkbox" type="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label class="container_form_label container_form_label-ib" for="vehicle2"> I have a car</label><br>
        <input class="container_form_input container_form_checkbox" type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
        <label class="container_form_label container_form_label-ib" for="vehicle3"> I have a boat</label><br>
        
        <!--radio group-->
        <h2 class="h3">Radio Group</h2>
        <input class="container_form_input container_form_radio" type="radio" id="html" name="fav_language" value="HTML">
        <label class="container_form_label container_form_label-ib" for="html">HTML</label><br>
        <input class="container_form_input container_form_radio" type="radio" id="css" name="fav_language" value="CSS">
        <label class="container_form_label container_form_label-ib" for="css">CSS</label><br>
        <input class="container_form_input container_form_radio" type="radio" id="javascript" name="fav_language" value="JavaScript">
        <label class="container_form_label container_form_label-ib" for="javascript">JavaScript</label>
        
        <!--dropdown-->
        <label class="container_form_label h3" for="occupation">Dropdown Element</label>
        <select id="occupation" class="container_form_select" name="occupation">
          <option value="back-end-developer" selected>Back-End Developer</option>
          <option value="front-end-developer">Front-End Developer</option>
          <option value="full-stack-developer">Full Stack Developer</option>
          <option value="product-owner">Product Owner</option>
          <option value="scrum-master">Scrum Master</option>
          <option value="tester">Tester</option>
        </select>
        
        <!--range element-->
        <h2 class="h3">Range Element</h2>
        <input class="container_form_range" type="range" id="a" name="a" value="50">
        <input class="container_form_range-num" type="number" id="b" name="b" value="50">
        <output class="container_form_range-output" name="x" for="a b"></output>
        

        <!--switch element-->
        <h2 class="h3">Switch Toggle Element</h2>
        <div role="switch" aria-checked="false" tabindex="0">
          <span class="label">Notifications</span>
          <span class="switch">
            <span></span>
          </span>
          <span class="on" aria-hidden="true">On</span>
          <span class="off" aria-hidden="true">Off</span>
        </div>
        
        <!--submit button-->
        <input class="container_form_submit" type="submit" value="Submit"/>
      </form>
</div>
