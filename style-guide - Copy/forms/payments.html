<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>

    <div class="container container-centre">
      <form class="container_form" action="#">
        
        <h1 class="h1">Credit Card Details</h1>
        
        <label class="container_form_label" for="cardholder-name">Card Name<span class="required">*</span></label>
        <input class="container_form_input" type="text" id="cardholder-name" required>
        
        <label class="container_form_label" for="card-number">Card Number<span class="required">*</span></label>
        <input class="container_form_input" type="text" id="card-number" required maxlength="16">

        <fieldset class="container_form_fieldset">
          <h2 class="h3">Card Expiration Date</h2>
          <label class="container_form_label container_form_label-ib" for="ed-month">Month<span class="required">*</span></label>
          <select id="ed-month" class="container_form_select" name="ed-month" required>
            <option value="january" selected>January</option>
            <option value="february">February</option>
            <option value="march">March</option>
            <option value="april">April</option>
            <option value="may">May</option>
            <option value="june">June</option>
             <option value="july">July</option>
            <option value="august">August</option>
            <option value="september">September</option>
             <option value="october">October</option>
            <option value="november">November</option>
            <option value="december">December</option>
          </select>

          <label class="container_form_label container_form_label-2 container_form_label-ib" for="ed-year">Year<span class="required">*</span></label>
          <input class="container_form_input container_form_input-2" type="text" id="ed-year" required maxlength="4">
        </fieldset>

        <h2 class="h3">CVV</h2>
        <input class="container_form_input container_form_input-2" type="text" id="cvv" required maxlength="3">
        <label class="container_form_label container_form_label-2" for="cvv"><small>3 or 4 digits usually found on the signature strip</small> <span class="required">*</span></label>
  
        <input class="container_form_submit" type="submit" value="Proceed"/>
      </form>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
