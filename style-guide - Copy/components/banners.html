<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warning Banners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <script src="./script.js"></script>
    <div class="container container-fullwidth">
      
      <!--error banner-->
      <div class="container_banner container_banner-error">
        <h2 class="h2"><span aria-hidden="true">&#9873;</span> Error <span class="close" aria-label="close" onclick="this.parentElement.parentElement.style.display='none';">&#10006;</span></h2>
        <p class="p">Something terrible has occured!</p>
      </div>

      <!--error banner-->
      <div class="container_banner container_banner-success">
        <h2 class="h2">
          <span aria-hidden="true">&#9873;</span> Success <span class="close" aria-label="close" onclick="this.parentElement.parentElement.style.display='none';">&#10006;</span></h2>
        <p class="p">Something wonderful has occured!</p>
      </div>

      <!--alert banner-->
      <div class="container_banner container_banner-alert">
        <h2 class="h2"><span aria-hidden="true">&#9873;</span> Alert <span class="close" aria-label="close" onclick="this.parentElement.parentElement.style.display='none';">&#10006;</span></h2>
        <p class="p">Something of consequence has occured!</p>
      </div>

      <!--information banner-->
      <div class="container_banner container_banner-info">
        <h2 class="h2"><span aria-hidden="true">&#9873;</span> Information <span class="close" aria-label="close" onclick="this.parentElement.parentElement.style.display='none';">&#10006;</span></h2>
        <p class="p">Something has occured!</p>
      </div>
      
    </div>
  </body>
</html>
