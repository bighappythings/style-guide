<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <title>Progress Display</title>
  </head>
  <body>
    <script src="./script.js"></script>

    <h1 class="h1 main-heading">Progress Display</h1>

    <div class="grid">
      <div class="grid_elem">
        <div class="grid_elem_value">
          <span>85%</span>
        </div>
        <div class="grid_elem_label">
          <span>React</span>
        </div>
      </div>
      
      <div class="grid_elem">
        <div class="grid_elem_value">
          <span>65%</span>
        </div>
        <div class="grid_elem_label">
          <span>Angular</span>
        </div>
      </div>
      
      <div class="grid_elem">
        <div class="grid_elem_value">
          <span>30%</span>
        </div>
        <div class="grid_elem_label">
          <span>Vue</span>
        </div>
      </div>
  </body>
</html>
